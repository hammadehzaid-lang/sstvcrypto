<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSTV صوتي</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--cd:#f1f3f5;--ac:#0b6bcb;--bd:#cdd2d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171b;--fg:#eceff3;--cd:#21262d;--ac:#5aa9ff;--bd:#3a424b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14171b;--fg:#eceff3;--cd:#21262d;--ac:#5aa9ff;--bd:#3a424b;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px}h3{margin:18px 0 6px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
button,.btn{background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.on,#send,#ls{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.5}
.tabs button{flex:1}
input,textarea,select{width:100%;box-sizing:border-box;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit;margin:4px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.meter{height:8px;background:var(--cd);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--ac)}
canvas{width:100%;aspect-ratio:4/3;background:var(--cd);border-radius:8px;display:block;margin-bottom:8px}
p{opacity:.85;min-height:1.4em}a{color:var(--ac)}
</style></head><body>
<h1>📡 SSTV صوتي — متوافق مع Robot36</h1>
<div class=tabs><button id=t1 class=on>المرسل Encoder</button><button id=t2>المستقبل Decoder</button></div>

<section id=enc>
<label>كلمة السر (اختياري — نفسها بالضبط عند المستقبل)</label><input id=ep autocomplete=off>
<label>الرسالة النصية</label><textarea id=et rows=4></textarea>
<label>أو اختر ملف / صورة (يتقدم على النص)</label><input id=ef type=file>
<label>دقة الصورة (السرعة)</label>
<select id=er><option value=240>كاملة 320×240 — 36 ثانية</option><option value=120>متوسطة — 18 ثانية</option><option value=60>سريعة — 9 ثواني</option></select>
<div class=row><button id=send>▶ إرسال عبر السماعة</button><button id=wav>💾 حفظ WAV</button></div>
<h3>🔊 إرسال ملف صوتي جاهز (WAV / MP3 / M4A)</h3>
<input id=af type=file accept="audio/*">
<div class=row><button id=asend>▶ تشغيل الملف عبر السماعة</button><button id=astop disabled>⏹ إيقاف</button></div>
<h3>🎵 ضغط وإرسال مقطع أغنية (قصير)</h3>
<input id=cf type=file accept="audio/*">
<div class=row><select id=cl><option value=5>أول 5 ثواني</option><option value=3>أول 3 ثواني</option><option value=10>أول 10 ثواني</option></select><select id=cr><option value=1>نسخة واحدة</option><option value=2>نسختان (أأمن، ضعف المدة)</option></select></div>
<button id=cs>🗜 ضغط وإرسال</button><p id=es></p>
</section>

<section id=dec hidden>
<label>كلمة السر (نفس كلمة المرسل)</label><input id=rp autocomplete=off>
<div class=row><button id=ls>🎤 ابدأ الاستماع</button><button id=lx disabled>⏹ إيقاف وفك</button><label class=btn>📂 ملف صوتي<input id=rf type=file accept="audio/*" hidden></label></div>
<div class=meter><i id=mt></i></div><p id=rs></p>
<h3>🎧 الصوت المستلم (Received Audio)</h3>
<audio id=ra controls style="width:100%"></audio>
<div class=row><button id=rw disabled>💾 حفظ الصوت المستلم WAV</button></div>
<h3>🎵 الأغنية المستلمة (Received Song)</h3>
<audio id=rm controls style="width:100%"></audio><a id=rl hidden download=song.webm>⬇ تحميل المقطع</a>
<h3>📝 النص المستلم (Receive TXT)</h3>
<textarea id=rt rows=5 readonly></textarea><a id=dl hidden download=received.bin>⬇ تحميل الملف المستلم</a>
<h3>🖼 الصورة المستلمة (Receive Image)</h3>
<canvas id=rc width=320 height=240></canvas><button id=sv>💾 حفظ الصورة</button>
</section>

<script>
const $=id=>document.getElementById(id),W=320,FS=44100,cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const pw=id=>$(id).value.trim().normalize('NFC');
$('t1').onclick=$('t2').onclick=e=>{const a=e.target.id=='t1';$('enc').hidden=!a;$('dec').hidden=a;$('t1').className=a?'on':'';$('t2').className=a?'':'on'};

/* ---- password -> keystream / permutation ---- */
function seed(p){let h=0xdeadbeef^p.length,g=0x41c6ce57;for(let i=0;i<p.length;i++){const c=p.charCodeAt(i);h=Math.imul(h^c,2654435761);g=Math.imul(g^c,1597334677)}h=Math.imul(h^h>>>16,2246822507)^Math.imul(g^g>>>13,3266489909);return h>>>0}
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function perm(n,p){const r=rng(seed(p)),a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ks(n,p){const r=rng(seed(p)^0x5bd1e995),o=new Uint8Array(n);for(let i=0;i<n;i++)o[i]=r()*256;return o}
/* scramble 2x2 pixel blocks (keeps chroma pairs intact, survives the lossy channel) */
function scr(d,L,p,inv){const bw=W/2,n=bw*(L>>1),pm=perm(n,p),o=new Uint8ClampedArray(d.length);
 for(let i=0;i<n;i++){const s=inv?i:pm[i],t=inv?pm[i]:i;
  for(let k=0;k<4;k++){const a=(((s/bw|0)*2+(k>>1))*W+(s%bw)*2+(k&1))*4,b=(((t/bw|0)*2+(k>>1))*W+(t%bw)*2+(k&1))*4;o[b]=d[a];o[b+1]=d[a+1];o[b+2]=d[a+2];o[b+3]=255}}
 return o}

/* ---- build Robot36 lines ---- */
function imgLines(d,L){const o=[];for(let y=0;y<L;y++){const Y=new Uint8ClampedArray(W),C=new Uint8ClampedArray(160),odd=y&1,y0=y&~1;
 for(let x=0;x<W;x++){const i=(y*W+x)*4;Y[x]=16+.25679*d[i]+.50413*d[i+1]+.09791*d[i+2]}
 for(let k=0;k<160;k++){let r=0,g=0,b=0;for(let j=0;j<4;j++){const i=((y0+(j>>1))*W+2*k+(j&1))*4;r+=d[i];g+=d[i+1];b+=d[i+2]}r/=4;g/=4;b/=4;
  C[k]=odd?128-.148223*r-.290993*g+.439216*b:128+.439216*r-.367788*g-.071427*b}
 o.push({Y,C,odd})}return o}
/* data: 1 bit per 4x2 black/white cell, 80 cells per row */
function dataLines(b){const rows=Math.max(10,Math.ceil(b.length*8/80)),o=[];
 for(let y=0;y<rows*2;y++){const Y=new Uint8ClampedArray(W),C=new Uint8ClampedArray(160).fill(128),r=y>>1;
  for(let x=0;x<W;x++){const q=r*80+(x>>2);Y[x]=(b[q>>3]>>(7-(q&7)))&1?255:0}
  o.push({Y,C,odd:y&1})}return o}
function pack(d,p){const n=d.length,b=new Uint8Array(n+6);b[0]=83;b[1]=84;b[2]=n>>8;b[3]=n&255;b.set(d,4);let s=0;for(let i=0;i<n;i++)s=(s+d[i]*(i+1))&65535;b[n+4]=s>>8;b[n+5]=s&255;
 if(p){const k=ks(b.length,p);for(let i=0;i<b.length;i++)b[i]^=k[i]}return b}
function parse(Ys,L,p){const rows=L>>1,n=rows*80>>3,b=new Uint8Array(n);
 for(let r=0;r<rows;r++)for(let c=0;c<80;c++){let s=0;for(let j=0;j<4;j++)s+=Ys[2*r+(j>>1)][4*c+1+(j&1)];if(s>=512){const q=r*80+c;b[q>>3]|=128>>(q&7)}}
 if(p){const k=ks(n,p);for(let i=0;i<n;i++)b[i]^=k[i]}
 if(b[0]!=83||b[1]!=84)return null;const m=b[2]<<8|b[3];if(m+6>n)return null;const d=b.slice(4,4+m);let s=0;for(let i=0;i<m;i++)s=(s+d[i]*(i+1))&65535;
 return s==(b[m+4]<<8|b[m+5])?d:null}

/* ---- synth (Robot 36, VIS 8) ---- */
function synth(lines){const sg=[],ad=(f,d)=>sg.push(f,d),F=v=>1500+v*800/255;
 ad(1900,.3);ad(1200,.01);ad(1900,.3);ad(1200,.03);[0,0,0,1,0,0,0,1].forEach(b=>ad(b?1100:1300,.03));ad(1200,.03);
 for(const l of lines){ad(1200,.009);ad(1500,.003);for(let k=0;k<W;k++)ad(F(l.Y[k]),.088/W);ad(l.odd?2300:1500,.0045);ad(1900,.0015);for(let k=0;k<160;k++)ad(F(l.C[k]),.044/160)}
 ad(1500,.1);let T=0;for(let i=1;i<sg.length;i+=2)T+=sg[i];
 const o=new Float32Array(Math.ceil(T*FS)+2);let t=0,n=0,ph=0;
 for(let i=0;i<sg.length;i+=2){t+=sg[i+1];const e=Math.round(t*FS),w=2*Math.PI*sg[i]/FS;for(;n<e;n++){ph+=w;o[n]=Math.sin(ph)*.8}}
 return o}
function wav(s,r=FS){const b=new DataView(new ArrayBuffer(44+s.length*2)),w=(o,t)=>[...t].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');b.setUint32(4,36+s.length*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,r,true);b.setUint32(28,r*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,s.length*2,true);
 for(let i=0;i<s.length;i++)b.setInt16(44+i*2,s[i]*32767,true);return new Blob([b],{type:'audio/wav'})}

async function build(){const p=pw('ep'),f=$('ef').files[0];let lines;
 if(f&&f.type.startsWith('image/')){const L=+$('er').value,bm=await createImageBitmap(f),t=cv(320,240),g=t.getContext('2d'),s=Math.max(320/bm.width,240/bm.height);
  g.drawImage(bm,(320-bm.width*s)/2,(240-bm.height*s)/2,bm.width*s,bm.height*s);
  const c2=cv(W,L),g2=c2.getContext('2d');g2.drawImage(t,0,0,W,L);let d=g2.getImageData(0,0,W,L).data;if(p)d=scr(d,L,p,false);lines=imgLines(d,L)}
 else{const b=f?new Uint8Array(await f.arrayBuffer()):new TextEncoder().encode($('et').value);
  if(!b.length)throw'اكتب رسالة أو اختر ملفاً';if(b.length>1194)throw'الحجم كبير: الحد الأقصى ≈1190 بايت لغير الصور';lines=dataLines(pack(b,p))}
 return synth(lines)}
let last;
$('send').onclick=async()=>{try{$('es').textContent='جارٍ التحضير…';last=await build();const c=new AudioContext(),b=c.createBuffer(1,last.length,FS);b.copyToChannel(last,0);const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start();
 $('es').textContent='يُرسَل الآن… المدة '+Math.round(last.length/FS)+' ثانية';s.onended=()=>{$('es').textContent='انتهى الإرسال ✔';c.close()}}catch(e){$('es').textContent='⚠ '+e}};
$('wav').onclick=async()=>{try{last=await build();const a=document.createElement('a');a.href=URL.createObjectURL(wav(last));a.download='sstv.wav';a.click()}catch(e){$('es').textContent='⚠ '+e}};

/* ---- send an existing audio file ---- */
let asrc,actx;
$('asend').onclick=async()=>{const f=$('af').files[0];if(!f){$('es').textContent='⚠ اختر ملفاً صوتياً أولاً';return}
 try{actx=new AudioContext();const b=await actx.decodeAudioData(await f.arrayBuffer());asrc=actx.createBufferSource();asrc.buffer=b;asrc.connect(actx.destination);asrc.start();
 $('asend').disabled=true;$('astop').disabled=false;$('es').textContent='يُرسَل الملف… '+Math.round(b.duration)+' ثانية';
 asrc.onended=()=>{$('es').textContent='انتهى إرسال الملف ✔';$('asend').disabled=false;$('astop').disabled=true;actx.close()}}catch(e){$('es').textContent='⚠ تعذر قراءة الملف الصوتي'}};
$('astop').onclick=()=>{asrc.stop()};

/* ---- compressed song: Opus 6kbps -> rows of 7 data bytes + index + CRC8 ---- */
function crc8(a){let c=0;for(const v of a){c^=v;for(let k=0;k<8;k++)c=c&128?(c<<1^7)&255:c<<1&255}return c}
function rowsOf(pl,p,rep){const key=p?ks(pl.length+7,p):null,n=Math.ceil(pl.length/7),o=new Uint8Array(n*rep*10);
 for(let r=0;r<rep;r++)for(let i=0;i<n;i++){const q=(r*n+i)*10;o[q]=i>>8;o[q+1]=i&255;
  for(let j=0;j<7;j++){const m=i*7+j;o[q+2+j]=(m<pl.length?pl[m]:0)^(key?key[m]:0)}
  o[q+9]=crc8(o.subarray(q,q+9))}return o}
async function squeeze(f,sec){const ac=new AudioContext(),b=await ac.decodeAudioData(await f.arrayBuffer()),d=ac.createMediaStreamDestination(),
 mt=['audio/webm;codecs=opus','audio/ogg;codecs=opus'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
 if(!mt)throw'المتصفح لا يدعم ضغط Opus (جرّب Chrome أو Firefox)';
 d.channelCount=1;d.channelCountMode='explicit';
 const mr=new MediaRecorder(d.stream,{mimeType:mt,audioBitsPerSecond:6000}),ch=[];mr.ondataavailable=e=>ch.push(e.data);
 const s=ac.createBufferSource();s.buffer=b;s.connect(d);const done=new Promise(r=>mr.onstop=r);
 mr.start();s.start(0,0,sec);setTimeout(()=>mr.stop(),Math.min(sec,b.duration)*1000+300);await done;ac.close();
 return[new Uint8Array(await new Blob(ch).arrayBuffer()),mt]}
function play(s){const c=new AudioContext(),b=c.createBuffer(1,s.length,FS);b.copyToChannel(s,0);const o=c.createBufferSource();o.buffer=b;o.connect(c.destination);o.start();
 $('es').textContent='يُرسَل الآن… المدة ≈ '+(s.length/FS/60).toFixed(1)+' دقيقة';o.onended=()=>{$('es').textContent='انتهى الإرسال ✔';c.close()}}
$('cs').onclick=async()=>{try{const f=$('cf').files[0];if(!f)throw'اختر ملفاً صوتياً';$('es').textContent='جارٍ الضغط (يستغرق مدة المقطع)…';
 const sec=+$('cl').value,rep=+$('cr').value,p=pw('ep'),[au,mt]=await squeeze(f,sec),n=au.length,pl=new Uint8Array(n+5);
 if(!n)throw'فشل الضغط';if((n+5)/7*rep>65000)throw'المقطع كبير';
 pl[0]=83;pl[1]=mt.includes('ogg')?66:65;pl[2]=n>>16&255;pl[3]=n>>8&255;pl[4]=n&255;pl.set(au,5);
 $('es').textContent='حجم المقطع المضغوط '+n+' بايت — جارٍ التحضير…';await sleep();
 last=synth(dataLines(rowsOf(pl,p,rep)));play(last)}catch(e){$('es').textContent='⚠ '+e}};
function parseA(Ys,L,p){const nr=L>>1,B=new Uint8Array(nr*10),got=new Map();
 for(let r=0;r<nr;r++)for(let c=0;c<80;c++){let s=0;for(let j=0;j<4;j++)s+=Ys[2*r+(j>>1)][4*c+1+(j&1)];if(s>=512){const q=r*80+c;B[q>>3]|=128>>(q&7)}}
 for(let r=0;r<nr;r++){const w=B.subarray(r*10,r*10+10);if(crc8(w.subarray(0,9))==w[9]){const i=w[0]<<8|w[1];if(!got.has(i))got.set(i,w.slice(2,9))}}
 if(got.size<8)return null;
 if(!got.has(0))return{err:'السطر الأول مفقود — أعد الإرسال (يُفضّل نسختان)'};
 const k0=p?ks(7,p):new Uint8Array(7),h=got.get(0).map((v,i)=>v^k0[i]);
 if(h[0]!=83||(h[1]!=65&&h[1]!=66))return{err:'كلمة السر لا تطابق المرسل'};
 const len=h[2]<<16|h[3]<<8|h[4],need=Math.ceil((len+5)/7);let miss=0;for(let i=0;i<need;i++)if(!got.has(i))miss++;
 if(miss)return{err:'نقص '+miss+' سطراً من '+need+' — أعد الإرسال بنسختين أو قرّب الجهازين'};
 const key=p?ks(need*7,p):new Uint8Array(need*7),o=new Uint8Array(len);
 for(let m=5;m<len+5;m++)o[m-5]=got.get(m/7|0)[m%7]^key[m];
 return{audio:o,type:h[1]==66?'audio/ogg':'audio/webm'}}
function showA(a){if(a.err){$('rs').textContent='⚠ '+a.err;return}
 const u=URL.createObjectURL(new Blob([a.audio],{type:a.type}));$('rm').src=u;$('rl').href=u;$('rl').hidden=false;
 $('rt').value='';$('dl').hidden=true;$('rs').textContent='✔ استُلم مقطع مضغوط ('+a.audio.length+' بايت) — شغّله في قسم الأغنية المستلمة'}

/* ---- decode ---- */
function dec(x,fs){const N=x.length,K=31,h=new Float32Array(N),P=new Float64Array(N+1),co=[];
 for(let n=1;n<=K;n+=2)co.push(2/(Math.PI*n)*(.54+.46*Math.cos(Math.PI*n/(K+1))));
 for(let i=K;i<N-K;i++){let s=0;for(let j=0,n=1;j<co.length;j++,n+=2)s+=co[j]*(x[i-n]-x[i+n]);h[i]=s}
 for(let i=0;i<N;i++){let f=1900;if(i>0){const re=x[i]*x[i-1]+h[i]*h[i-1],im=h[i]*x[i-1]-x[i]*h[i-1];f=Math.max(1000,Math.min(2500,Math.atan2(im,re)*fs/6.28318))}P[i+1]=P[i]+f}
 const ms=fs/1000,avg=(a,b)=>{a=Math.max(0,Math.round(a));b=Math.min(N,Math.round(b));return b>a?(P[b]-P[a])/(b-a):1900};
 const st=Math.max(1,fs/10000|0),w=fs*.0005|0,c=[];let run=-1;
 for(let i=w;i<N-w;i+=st){const v=(P[i+w]-P[i-w])/(2*w),lo=v>1110&&v<1290;
  if(lo&&run<0)run=i;else if(!lo&&run>=0){if((i-run)/ms>6){const pv=avg(i+.6*ms,i+2.6*ms);if(pv>1380&&pv<1640)c.push(i+.2*ms-9*ms)}run=-1}}
 const T=150*ms,tol=6*ms;let s=-1;for(let i=0;i<c.length&&s<0;i++)if(c.some(q=>Math.abs(q-c[i]-T)<tol))s=i;if(s<0)return null;
 let cur=c[s],miss=0,pos=[],ok=[],good=true;
 while(cur+T<=N){pos.push(cur);ok.push(good);let b=null;for(const q of c)if(Math.abs(q-cur-T)<tol&&(b==null||Math.abs(q-cur-T)<Math.abs(b-cur-T)))b=q;
  if(b!=null){cur=b;miss=0;good=true}else{cur+=T;good=false;if(++miss>3)break}}
 while(pos.length&&!ok[ok.length-1]){pos.pop();ok.pop()}
 const V=(a,e)=>Math.max(0,Math.min(255,(avg(a,e)-1500)*255/800)),Ys=[],Cs=[],isV=[];
 for(const b of pos){const Y=new Uint8Array(W),C=new Uint8Array(160);
  for(let k=0;k<W;k++)Y[k]=V(b+(12+k*88/W)*ms,b+(12+(k+1)*88/W)*ms);
  for(let k=0;k<160;k++)C[k]=V(b+(106+k*44/160)*ms,b+(106+(k+1)*44/160)*ms);
  Ys.push(Y);Cs.push(C);isV.push(avg(b+100.5*ms,b+104*ms)<1900)}
 return{L:pos.length,Ys,Cs,isV}}
const sleep=()=>new Promise(r=>setTimeout(r,40));
let rxw;$('rw').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(rxw);a.download='received.wav';a.click()};
async function proc(x,fs){rxw=wav(x,fs);$('ra').src=URL.createObjectURL(rxw);$('rw').disabled=false;$('rs').textContent='جارٍ فك الإشارة…';$('mt').style.width=0;await sleep();
 const p=pw('rp'),r=dec(x,fs);if(!r||r.L<4){$('rs').textContent='⚠ لم أجد إشارة SSTV. قرّب الجهازين وارفع الصوت وقلل الضجيج.';return}
 const d=parse(r.Ys,r.L,p),g=$('rc').getContext('2d'),a=d?null:parseA(r.Ys,r.L,p);
